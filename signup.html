
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | ArtVista</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">ArtVista<span>.</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="login.html">Login</a>
      <a href="signup.html" class="nav-button active">Sign Up</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <p class="eyebrow">JOIN OUR ART COMMUNITY</p>
      <h1>Create an Account</h1>
      <p class="auth-subtitle">Become part of the ArtVista experience.</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="signupName">Full name</label>
          <input type="text" id="signupName" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email address</label>
          <input type="email" id="signupEmail" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="password" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter password again" required minlength="6">
        </div>

        <button type="submit" class="btn btn-full">Create Account</button>
        <p id="signupMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      <p class="demo-note">Demo form only: this page does not create or store accounts.</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ArtVista. Celebrating art and creativity.</p>
  </footer>
</body>
</html>
