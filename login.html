
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ArtVista</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">ArtVista<span>.</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="login.html" class="active">Login</a>
      <a href="signup.html" class="nav-button">Sign Up</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Login to ArtVista</h1>
      <p class="auth-subtitle">Continue exploring your favourite artworks.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-full">Login</button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      <p class="demo-note">Demo form only: this page does not verify or store accounts.</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ArtVista. Celebrating art and creativity.</p>
  </footer>
</body>
</html>
